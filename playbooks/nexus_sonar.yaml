---
- name: Install SonarQube and Nexus on a single server
  hosts: sonar_nexus
  become: yes
  roles:
    - Roles/sonar
  tags:
    - sonar_nexus_install
  

- name: Change hostname for sonar server
  hosts:
    - sonar_nexus
  become: yes
  tasks:
    - name: Set hostname for sonar_nexus
      ansible.builtin.hostname:
        name: sonar
  tags:
  - hostname