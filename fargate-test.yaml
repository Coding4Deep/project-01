apiVersion: v1
kind: Pod
metadata:
  name: nginx-fargate
  namespace: fargate-apps
  labels:
    app: nginx-fargate
spec:
  containers:
    - name: nginx
      image: nginx
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: fargate-apps
spec:
  type: LoadBalancer
  selector:
    app: nginx-fargate
  ports:
    - port: 80
      targetPort: 80

