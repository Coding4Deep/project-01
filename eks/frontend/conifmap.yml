apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        server {
            listen 80;
            server_name localhost;
            root /usr/share/nginx/html;
            index index.html;

            location / {
                try_files $uri $uri/ /index.html;
            }
            
            location /api/users/ {
                proxy_pass http://user-service.user-service.svc.cluster.local:8080/api/users/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            location /socket.io/ {
                proxy_pass http://chat-service.chat-service.svc.cluster.local:3001;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            location /api/chat/ {
                proxy_pass http://chat-service.chat-service.svc.cluster.local:3001/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }
  startup.sh: |
    #!/bin/sh
    # Replace hardcoded localhost URLs with relative paths
    find /usr/share/nginx/html -name "*.js" -exec sed -i 's|http://localhost:8080||g' {} \;
    find /usr/share/nginx/html -name "*.js" -exec sed -i 's|http://localhost:3001||g' {} \;
    # Start nginx
    nginx -g "daemon off;"