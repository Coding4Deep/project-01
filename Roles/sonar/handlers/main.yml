---
- name: reload systemd
  systemd:
    daemon_reload: yes

- name: start sonarqube
  systemd:
    name: sonarqube
    state: started
    enabled: yes

- name: Reload systemd
  command: systemctl daemon-reload

- name: Enable and start Nexus
  systemd:
    name: nexus
    enabled: yes
    state: restarted