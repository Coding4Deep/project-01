# -------------------------
# Install SonarQube
# -------------------------

- name: Create sonar user
  user:
    name: "{{ sonar_user }}"
    system: yes
    create_home: no
    shell: /bin/bash

- name: Download SonarQube
  get_url:
    url: "https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-{{ sonar_version }}.zip"
    dest: "/tmp/sonarqube-{{ sonar_version }}.zip"
    mode: '0644'

- name: Extract SonarQube
  unarchive:
    src: "/tmp/sonarqube-{{ sonar_version }}.zip"
    dest: /opt/
    remote_src: yes
    creates: "{{ sonar_install_dir }}-{{ sonar_version }}"

- name: Remove existing SonarQube symlink if exists
  file:
    path: "{{ sonar_install_dir }}"
    state: absent
    

- name: Rename extracted folder to /opt/sonarqube
  command: mv {{ sonar_install_dir }}-{{ sonar_version }} /opt/sonarqube
  args:
    creates: "{{ sonar_install_dir }}"

- name: Change ownership of SonarQube
  file:
    path: "{{ sonar_install_dir }}"
    owner: "{{ sonar_user }}"
    group: "{{ sonar_group }}"
    recurse: yes
    state: directory

- name: Create systemd service file for SonarQube
  template:
    src: sonarqube.service.j2
    dest: /etc/systemd/system/{{ sonar_service_name }}.service
  notify: 
    - Reload systemd daemon
    - Restart sonarqube
  tags: sonar-service
